<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0B2E" />
      <stop offset="50%" stop-color="#24113D" />
      <stop offset="100%" stop-color="#3B1366" />
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#24113D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#24113D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <circle cx="240" cy="250" r="300" fill="url(#glow1)" />
  <circle cx="600" cy="700" r="350" fill="url(#glow2)" />

  <!-- Harmonic sound waves -->
  <g fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.75">
    <path d="M-100 450 Q 100 350, 300 450 T 700 450 T 1100 450" />
    <path d="M-100 490 Q 150 380, 400 490 T 900 490 T 1200 490" stroke-width="2" opacity="0.9" />
    <path d="M-100 530 Q 120 440, 350 530 T 800 530 T 1150 530" />
    <path d="M-100 570 Q 200 490, 500 570 T 1000 570" opacity="0.6" />
    <path d="M-100 410 Q 180 320, 420 410 T 850 410" opacity="0.5" stroke-dasharray="4 6" />
  </g>

  <!-- Ambient audio bars pattern -->
  <g fill="#C4B5FD" opacity="0.35">
    <rect x="250" y="650" width="3" height="40" rx="1.5" />
    <rect x="260" y="635" width="3" height="70" rx="1.5" />
    <rect x="270" y="620" width="3" height="100" rx="1.5" />
    <rect x="280" y="640" width="3" height="60" rx="1.5" />
    <rect x="290" y="610" width="3" height="120" rx="1.5" />
    <rect x="300" y="630" width="3" height="80" rx="1.5" />
    <rect x="310" y="645" width="3" height="50" rx="1.5" />
    <rect x="320" y="625" width="3" height="90" rx="1.5" />
    <rect x="330" y="615" width="3" height="110" rx="1.5" />
    <rect x="340" y="635" width="3" height="70" rx="1.5" />
    <rect x="350" y="650" width="3" height="40" rx="1.5" />
  </g>
</svg>
